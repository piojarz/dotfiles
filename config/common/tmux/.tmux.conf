# vim:ft=tmux
# tmux display things in 256 colors
# set -g default-terminal "tmux-256color"

# Improve colors
set -g default-terminal "${TERM}"

# enable italics
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Enable undercurl colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g history-limit 20000

# automatically renumber tmux windows
set -g renumber-windows on

######################
#### General Settings ####
######################
 # set the prefix to control-a. This is more convenient than control-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind-key a send-prefix

set -g set-clipboard on

# enable mouse support for switching panes/windows
setw -g mouse on

# make delay shorter
set -g escape-time 0
# make window/pane index start with 1
set -g base-index 1
setw -g pane-base-index 1
set-option -g focus-events on
set-option -g set-titles on

# set vi mode for copy mode
setw -g mode-keys vi
set -g status-keys vi

# automatically rename windows when an explicit name is not set
set-window-option -g automatic-rename on
# (the window's icon comes from @cmd-icon in the status line section below)
set-option -g automatic-rename-format "#{b:pane_current_path}"

# set the default title format
set-option -g set-titles-string "#T - #W"

# disabled activity monitoring
setw -g monitor-activity off
set -g visual-activity off

# Bell monitoring stays ON: Claude Code's Stop/Notification hooks write BEL to
# their pane's tty, so a worktree that needs input flags its window in the
# status bar. See docs/coursedog-worktree-dev-env.md.
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Killing the current session (picker ctrl-d, `workmux remove`, closing its
# last pane) switches the client to another session instead of detaching it.
set -g detach-on-destroy off

######################
#### Key Bindings ####
######################

# keep CWD when opening new window
unbind c
bind c new-window -c "#{pane_current_path}"

# tile all windows
unbind =
bind = select-layout tiled

# reload config file
# (~/.tmux.conf, not ~/.config/tmux/tmux.conf: this file is linked as .tmux.conf)
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# split window and fix path for tmux 1.9
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# synchronize all panes in a window
bind y setw synchronize-panes

# pane movement shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resize pane shortcuts
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# open lazygit in a new window
bind-key g display-popup -w "80%" -h "80%" -d "#{pane_current_path}" -E "lazygit"

# toggle the status bar
bind-key -T prefix T set-option -g status

# Workspace picker: tmux sessions + sesh.toml entries + zoxide dirs in fzf.
# The scripts live in $DOTFILES/bin (see each one's header for details);
# popup commands run through zsh, whose .zshenv always exports $DOTFILES.
unbind s
bind-key s display-popup -E -w 70% -h 60% -d "#{pane_current_path}" '"$DOTFILES/bin/sesh-pick"'

# jump back to the previous workspace (tmux's own `L` for this is taken by resize)
bind-key Tab run-shell "sesh last"

# jump to the workmux agent that most recently finished or is waiting for input
bind-key N run-shell "workmux last-done"

# GitHub PR review: pick an open PR of the current repo, open it as a workmux worktree session
bind-key P display-popup -E -w 80% -h 70% -d "#{pane_current_path}" '"$DOTFILES/bin/pr-review"'

# Per-workspace persistent scratch terminal (<session>-scratch) in a popup;
# the same key closes it again from inside.
bind-key f run-shell -b '"$DOTFILES/bin/tmux-scratch" "#{client_name}" "#{session_name}" "#{pane_current_path}"'

# more settings to make copy-mode more vim-like
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer

# Vim-style selection and copying
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Mouse support
set -g mouse on

# Clipboard integration
# macOS: use pbcopy (will work with xclip on Linux too if installed)
if-shell 'command -v pbcopy' {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
} {
  # Linux fallback
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
}

######################
#### Status Line ####
######################
# Tokyo Night colors, matching kitty/nvim (bg #1a1b26, fg #c0caf5).
# workmux's own window-status-format rewrite is disabled (status_format: false
# in config/common/workmux/config.yaml); its @workmux_status icon is added below.

set -g status-position top
set -g status-interval 5
set -g status-justify centre
set -g status-style "bg=default,fg=#a9b1d6"
set -g status-left-length 60
set -g status-right-length 100

# Nerd Font icon for the command running in a window's active pane, used via
# #{E:@cmd-icon} (E: expands the option's value as a format).
set -g @cmd-icon "#{?#{==:#{pane_current_command},nvim},,#{?#{==:#{pane_current_command},claude},󰚩,#{?#{==:#{pane_current_command},lazygit},,#{?#{==:#{pane_current_command},node},,}}}}"

# Session name; turns yellow while the prefix key is pressed. #{server_sessions}
# counts every session, scratch and unnamed ones included -- a rough "how much
# is open" hint, not an exact workspace count.
# Badge colour: yellow while the prefix key is pressed, blue otherwise.
set -g @badge-bg "#{?client_prefix,#e0af68,#7aa2f7}"

# Session count, then the session badge, followed by a purple COPY segment while the active pane is in
# copy mode; segments are joined with powerline slants ("#," escapes a comma
# inside a #{?...} branch).
set -g status-left "#[fg=#565f89,bg=default] 󰕮 #{server_sessions} #[fg=#{E:@badge-bg},bg=default]#[fg=#1a1b26,bg=#{E:@badge-bg},bold]  #S #{?pane_in_mode,#[fg=#{E:@badge-bg}#,bg=#bb9af7]#[fg=#1a1b26#,bg=#bb9af7] COPY #[fg=#bb9af7#,bg=default],#[fg=#{E:@badge-bg}#,bg=default]} "

# Windows: icon, index, name, workmux agent status, and a red bell marker when
# a Claude hook rang it (see the bell monitoring settings above).
set -g window-status-format "#[fg=#{?window_bell_flag,#f7768e,#565f89}] #{E:@cmd-icon} #I  #W#{?@workmux_status, #{@workmux_status},}#{?window_bell_flag, 󰂞,} "
set -g window-status-current-format "#[fg=#292e42,bg=default]#[fg=#c0caf5,bg=#292e42,bold] #{E:@cmd-icon} #I #[fg=#565f89,nobold]#[fg=#c0caf5,bold] #W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag, 󰁌,} #[fg=#292e42,bg=default,nobold]"
set -g window-status-separator ""
set -g window-status-bell-style "default"

# Right: pane sync warning, directory, git branch, time. The branch is a
# shell-out, re-run every status-interval.
set -g status-right "#{?pane_synchronized,#[fg=#f7768e#,bold]󰓦 SYNC #[nobold],}#[fg=#565f89] #{b:pane_current_path}  #[fg=#bb9af7]#(git -C #{q:pane_current_path} branch --show-current 2>/dev/null)  #[fg=#292e42]#[fg=#c0caf5,bg=#292e42] %H:%M "

# Pane borders: titled with index + command (handy in workmux layouts), active
# pane highlighted. The title row only shows in windows with 2+ panes -- in a
# single-pane window it would just eat a line -- so it's toggled per window
# whenever a layout changes (split, kill, resize), and once for every
# existing window on (re)load.
set -g pane-border-status off
set-hook -g window-layout-changed 'if-shell -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'
run-shell 'tmux list-windows -a -F "##{window_id} ##{window_panes}" | while read -r w n; do if [ "$n" -gt 1 ]; then tmux setw -t "$w" pane-border-status top; else tmux setw -t "$w" -u pane-border-status; fi; done'
set -g pane-border-format " #{pane_index}: #{pane_current_command} "
set -g pane-border-lines single
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "bg=#292e42,fg=#c0caf5"
set -g message-command-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#33467c,fg=#c0caf5"
set -g popup-border-style "fg=#7aa2f7"
set -g popup-border-lines rounded

# Click the session name to open the workspace picker.
bind -n MouseDown1StatusLeft display-popup -E -w 70% -h 60% -d "#{pane_current_path}" '"$DOTFILES/bin/sesh-pick"'

# TPM (Tmux Plugin Manager). Plugins are cloned to $XDG_DATA_HOME, never into
# ~/.config/tmux -- that directory is a symlink into the dotfiles repo.
# TPM itself comes from the plugins dir (Arch: cloned by scripts/linux/arch.sh)
# or from Homebrew (Brewfile `tpm`). Press prefix + I to install plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"

# List of plugins
# Neither of the previous plugins ever actually loaded (TPM wasn't found), and
# both were dropped rather than switched on now that it is:
# - vim-tmux-navigator: nvim has no matching plugin, and its root C-h/j/k/l
#   bindings would shadow zsh's C-j/C-k history search.
# - tmux-sensible: everything useful is already set explicitly above, and it
#   unconditionally forces `status-keys emacs` over this file's `vi`.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'

# tmux-fzf: lower-level session/window/pane/process menu on prefix + F
# (its default key). Workspace switching stays on prefix + s.
TMUX_FZF_ORDER="window|pane|session|process|command|keybinding"

# Initialize TMUX plugin manager (keep this line at the very bottom)
if-shell 'test -x "$HOME/.local/share/tmux/plugins/tpm/tpm"' {
  run '$HOME/.local/share/tmux/plugins/tpm/tpm'
} {
  if-shell 'test -x /opt/homebrew/opt/tpm/share/tpm/tpm' {
    run '/opt/homebrew/opt/tpm/share/tpm/tpm'
  }
}
