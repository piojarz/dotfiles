# Vim-style keybindings for Yazi
# Most keys are similar to vim for muscle memory

[manager]
# Navigation
keymap = [
  # Basic movement
  { on = "j", run = "arrow 1", desc = "Move down" },
  { on = "k", run = "arrow -1", desc = "Move up" },
  { on = "h", run = "leave", desc = "Go to parent directory" },
  { on = "l", run = "enter", desc = "Enter directory/open file" },
  { on = "q", run = "close", desc = "Close yazi" },
  
  # Faster navigation
  { on = "gg", run = "arrow -99999999", desc = "Go to top" },
  { on = "G", run = "arrow 99999999", desc = "Go to bottom" },
  { on = "<C-d>", run = "arrow 5", desc = "Scroll down 5 items" },
  { on = "<C-u>", run = "arrow -5", desc = "Scroll up 5 items" },
  { on = "<C-f>", run = "arrow 10", desc = "Scroll down 10 items" },
  { on = "<C-b>", run = "arrow -10", desc = "Scroll up 10 items" },
  
  # Directory navigation
  { on = "~", run = "cd ~", desc = "Go to home directory" },
  { on = "/", run = "cd /", desc = "Go to root directory" },
  { on = "-", run = "cd -", desc = "Go to previous directory" },
  { on = "H", run = "back", desc = "Go back" },
  { on = "L", run = "forward", desc = "Go forward" },
  
  # Tab management
  { on = "t", run = "tab_create --current", desc = "Create new tab" },
  { on = "<C-n>", run = "tab_create --current", desc = "Create new tab" },
  { on = "<C-w>", run = "tab_close", desc = "Close current tab" },
  { on = "[", run = "tab_switch -1 --relative", desc = "Previous tab" },
  { on = "]", run = "tab_switch 1 --relative", desc = "Next tab" },
  { on = "1", run = "tab_switch 0 --absolute", desc = "Switch to tab 1" },
  { on = "2", run = "tab_switch 1 --absolute", desc = "Switch to tab 2" },
  { on = "3", run = "tab_switch 2 --absolute", desc = "Switch to tab 3" },
  { on = "4", run = "tab_switch 3 --absolute", desc = "Switch to tab 4" },
  { on = "5", run = "tab_switch 4 --absolute", desc = "Switch to tab 5" },
  { on = "6", run = "tab_switch 5 --absolute", desc = "Switch to tab 6" },
  { on = "7", run = "tab_switch 6 --absolute", desc = "Switch to tab 7" },
  { on = "8", run = "tab_switch 7 --absolute", desc = "Switch to tab 8" },
  { on = "9", run = "tab_switch 8 --absolute", desc = "Switch to tab 9" },
  
  # Selection
  { on = "<Space>", run = "select --toggle", desc = "Toggle selection" },
  { on = "v", run = "visual_mode", desc = "Enter visual mode" },
  { on = "V", run = "visual_mode --unset", desc = "Enter visual mode (unset)" },
  { on = "<C-a>", run = "select_all --state=true", desc = "Select all" },
  { on = "<C-r>", run = "select_all --state=false", desc = "Deselect all" },
  
  # Operations
  { on = "o", run = "open", desc = "Open selected files" },
  { on = "O", run = "open --interactive", desc = "Open with specific program" },
  { on = "y", run = "yank", desc = "Yank selected files" },
  { on = "x", run = "cut", desc = "Cut selected files" },
  { on = "p", run = "paste", desc = "Paste files" },
  { on = "P", run = "paste --force", desc = "Paste files (overwrite)" },
  { on = "d", run = "remove", desc = "Delete files" },
  { on = "D", run = "remove --permanently", desc = "Delete permanently" },
  { on = "a", run = "create", desc = "Create file" },
  { on = "A", run = "create --dir", desc = "Create directory" },
  { on = "r", run = "rename", desc = "Rename file" },
  { on = ":", run = "shell", desc = "Run shell command" },
  { on = ";", run = "shell --interactive", desc = "Run interactive shell command" },
  { on = ".", run = "hidden toggle", desc = "Toggle hidden files" },
  
  # Search and filter
  { on = "s", run = "search rg", desc = "Search with ripgrep" },
  { on = "S", run = "search fzf", desc = "Search with fzf" },
  { on = "f", run = "filter", desc = "Filter files" },
  { on = "F", run = "filter --restore", desc = "Restore filter" },
  { on = "<C-s>", run = "escape --search", desc = "Cancel search" },
  
  # Sorting
  { on = ",m", run = "sort mtime --reverse=no", desc = "Sort by modified time" },
  { on = ",M", run = "sort mtime --reverse", desc = "Sort by modified time (reverse)" },
  { on = ",a", run = "sort alphabetical --reverse=no", desc = "Sort alphabetically" },
  { on = ",A", run = "sort alphabetical --reverse", desc = "Sort alphabetically (reverse)" },
  { on = ",n", run = "sort natural --reverse=no", desc = "Sort naturally" },
  { on = ",N", run = "sort natural --reverse", desc = "Sort naturally (reverse)" },
  { on = ",s", run = "sort size --reverse=no", desc = "Sort by size" },
  { on = ",S", run = "sort size --reverse", desc = "Sort by size (reverse)" },
  
  # Help
  { on = "<F1>", run = "help", desc = "Show help" },
  { on = "?<F1>", run = "help", desc = "Show help" },
  { on = "<C-h>", run = "help", desc = "Show help" },
  
  # Tasks and copy/move progress
  { on = "w", run = "tasks_show", desc = "Show task manager" },
  
  # Preview
  { on = "T", run = "toggle_preview", desc = "Toggle preview" },
  { on = "i", run = "preview --peek", desc = "Preview peek" },
  { on = "I", run = "preview --follow", desc = "Preview follow" },
  
  # Quick navigation
  { on = "g", run = "cd --interactive", desc = "Go to directory (interactive)" },
  
  # Bookmarks
  { on = "'", run = "jump", desc = "Jump to bookmark" },
  { on = "m", run = "bookmark add", desc = "Add bookmark" },
  { on = "'", run = "bookmark jump", desc = "Jump to bookmark" },
  { on = "b", run = "bookmark list", desc = "List bookmarks" },
  
  # Quit
  { on = "<C-c>", run = "close", desc = "Close yazi" },
  { on = "<C-q>", run = "close", desc = "Close yazi" },
]

[tasks]
keymap = [
  { on = "<Esc>", run = "close", desc = "Close task manager" },
  { on = "<C-c>", run = "close", desc = "Close task manager" },
  { on = "q", run = "close", desc = "Close task manager" },
  { on = "k", run = "arrow -1", desc = "Move up" },
  { on = "j", run = "arrow 1", desc = "Move down" },
  { on = "<Up>", run = "arrow -1", desc = "Move up" },
  { on = "<Down>", run = "arrow 1", desc = "Move down" },
  { on = "<Enter>", run = "inspect", desc = "Inspect task" },
  { on = "x", run = "cancel", desc = "Cancel task" },
  { on = "X", run = "cancel --all", desc = "Cancel all tasks" },
  { on = "<C-s>", run = "suspend", desc = "Suspend task" },
  { on = "<C-r>", run = "resume", desc = "Resume task" },
  { on = "<C-p>", run = "pause", desc = "Pause task" },
  { on = "<C-d>", run = "remove", desc = "Remove task" },
  { on = "<C-a>", run = "hover --top", desc = "Go to top" },
  { on = "<C-e>", run = "hover --bottom", desc = "Go to bottom" },
]

[select]
keymap = [
  { on = "<Esc>", run = "close", desc = "Close selection" },
  { on = "<C-c>", run = "close", desc = "Close selection" },
  { on = "<Enter>", run = "close --submit", desc = "Submit selection" },
  { on = "k", run = "arrow -1", desc = "Move up" },
  { on = "j", run = "arrow 1", desc = "Move down" },
  { on = "<Up>", run = "arrow -1", desc = "Move up" },
  { on = "<Down>", run = "arrow 1", desc = "Move down" },
  { on = "gg", run = "arrow -99999999", desc = "Go to top" },
  { on = "G", run = "arrow 99999999", desc = "Go to bottom" },
]

[input]
keymap = [
  { on = "<Esc>", run = "close", desc = "Close input" },
  { on = "<C-c>", run = "close", desc = "Close input" },
  { on = "<Enter>", run = "close --submit", desc = "Submit input" },
  { on = "<Backspace>", run = "backspace", desc = "Backspace" },
  { on = "<C-h>", run = "backspace", desc = "Backspace" },
  { on = "<C-w>", run = "kill backward", desc = "Kill backward word" },
  { on = "<C-u>", run = "kill backward line", desc = "Kill backward line" },
  { on = "<C-k>", run = "kill forward line", desc = "Kill forward line" },
  { on = "<C-a>", run = "move -99999999", desc = "Go to start" },
  { on = "<C-e>", run = "move 99999999", desc = "Go to end" },
  { on = "<C-f>", run = "move 1", desc = "Move forward" },
  { on = "<C-b>", run = "move -1", desc = "Move backward" },
  { on = "<Left>", run = "move -1", desc = "Move backward" },
  { on = "<Right>", run = "move 1", desc = "Move forward" },
  { on = "<C-d>", run = "delete", desc = "Delete" },
  { on = "<C-t>", run = "complete", desc = "Complete" },
  { on = "<Tab>", run = "complete", desc = "Complete" },
  { on = "<C-p>", run = "complete --backward", desc = "Complete backward" },
  { on = "<C-n>", run = "complete --forward", desc = "Complete forward" },
  { on = "<C-r>", run = "paste", desc = "Paste" },
  { on = "<C-v>", run = "paste", desc = "Paste" },
  { on = "<Home>", run = "move -99999999", desc = "Go to start" },
  { on = "<End>", run = "move 99999999", desc = "Go to end" },
  { on = "<Delete>", run = "delete", desc = "Delete" },
  { on = "<C-Backspace>", run = "kill backward word", desc = "Kill backward word" },
  { on = "<S-Backspace>", run = "backspace", desc = "Backspace" },
]

[help]
keymap = [
  { on = "<Esc>", run = "close", desc = "Close help" },
  { on = "<C-c>", run = "close", desc = "Close help" },
  { on = "q", run = "close", desc = "Close help" },
  { on = "k", run = "arrow -1", desc = "Move up" },
  { on = "j", run = "arrow 1", desc = "Move down" },
  { on = "<Up>", run = "arrow -1", desc = "Move up" },
  { on = "<Down>", run = "arrow 1", desc = "Move down" },
  { on = "gg", run = "arrow -99999999", desc = "Go to top" },
  { on = "G", run = "arrow 99999999", desc = "Go to bottom" },
  { on = "f", run = "filter", desc = "Filter" },
  { on = "/", run = "filter", desc = "Filter" },
  { on = "<C-s>", run = "escape --search", desc = "Cancel search" },
  { on = "<Enter>", run = "action", desc = "Run action" },
]

[completion]
keymap = [
  { on = "<C-c>", run = "close", desc = "Close completion" },
  { on = "<Tab>", run = "close --submit", desc = "Submit completion" },
  { on = "<Enter>", run = "close --submit", desc = "Submit completion" },
  { on = "k", run = "arrow -1", desc = "Move up" },
  { on = "j", run = "arrow 1", desc = "Move down" },
  { on = "<Up>", run = "arrow -1", desc = "Move up" },
  { on = "<Down>", run = "arrow 1", desc = "Move down" },
  { on = "<C-p>", run = "arrow -1", desc = "Move up" },
  { on = "<C-n>", run = "arrow 1", desc = "Move down" },
]
