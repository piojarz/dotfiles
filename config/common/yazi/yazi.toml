# Yazi configuration
# Modern file manager with async I/O and vim-like keybindings

[mgr]
# Show hidden files by default
show_hidden = false
# Sort by modification time (newest first)
sort_by = "mtime"
sort_reverse = true
# Sort directories first
sort_dir_first = true
# Show file sizes in human-readable format
linemode = "size"
# Show symlink target paths
show_symlink = true

[preview]
# Wrap text in preview
wrap = "yes"
# Tab size
tab_size = 2
# Max preview file size (10MB)
max_width = 1024
max_height = 1024
# Cache directory (use tmpfs for speed if available)
cache_dir = ""
# Image preview protocol (supports kitty, iterm2, etc.)
image_filter = "triangle"
image_quality = 90

[opener]
# Default opener rules
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
  { run = 'code "$@"', orphan = true, for = "unix" },
]
play = [
  { run = 'vlc "$@"', orphan = true, for = "linux" },
  { run = 'open -a VLC "$@"', orphan = true, for = "macos" },
]
open = [
  { run = 'xdg-open "$@"', orphan = true, for = "linux" },
  { run = 'open "$@"', orphan = true, for = "macos" },
]
reveal = [
  { run = 'open -R "$1"', orphan = true, for = "macos" },
  { run = 'explorer.exe /select,"$1"', orphan = true, for = "windows" },
  { run = '''exiftool "$1"; echo "Press enter to exit"; read''', block = true, for = "unix" },
]

[open]
# Rules for opening files
rules = [
  # Text files - open in editor
  { url = "*.txt", use = "edit" },
  { url = "*.md", use = "edit" },
  { url = "*.mdx", use = "edit" },
  { url = "*.json", use = "edit" },
  { url = "*.yaml", use = "edit" },
  { url = "*.yml", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.ini", use = "edit" },
  { url = "*.conf", use = "edit" },
  { url = "*.cfg", use = "edit" },
  { url = "*.sh", use = "edit" },
  { url = "*.zsh", use = "edit" },
  { url = "*.bash", use = "edit" },
  { url = "*.fish", use = "edit" },
  { url = "*.py", use = "edit" },
  { url = "*.js", use = "edit" },
  { url = "*.ts", use = "edit" },
  { url = "*.jsx", use = "edit" },
  { url = "*.tsx", use = "edit" },
  { url = "*.vue", use = "edit" },
  { url = "*.rb", use = "edit" },
  { url = "*.go", use = "edit" },
  { url = "*.rs", use = "edit" },
  { url = "*.c", use = "edit" },
  { url = "*.cpp", use = "edit" },
  { url = "*.h", use = "edit" },
  { url = "*.hpp", use = "edit" },
  { url = "*.java", use = "edit" },
  { url = "*.kt", use = "edit" },
  { url = "*.scala", use = "edit" },
  { url = "*.lua", use = "edit" },
  { url = "*.php", use = "edit" },
  { url = "*.sql", use = "edit" },
  { url = "*.html", use = "edit" },
  { url = "*.css", use = "edit" },
  { url = "*.scss", use = "edit" },
  { url = "*.sass", use = "edit" },
  { url = "*.less", use = "edit" },
  { url = "Dockerfile", use = "edit" },
  { url = "Makefile", use = "edit" },
  { url = "CMakeLists.txt", use = "edit" },
  { url = "*.mk", use = "edit" },
  # Videos
  { mime = "video/*", use = "play" },
  # Audio
  { mime = "audio/*", use = "play" },
  # Images - reveal
  { mime = "image/*", use = "reveal" },
  # PDFs and documents
  { mime = "application/pdf", use = "open" },
  # Archives
  { mime = "application/zip", use = "reveal" },
  { mime = "application/gzip", use = "reveal" },
  { mime = "application/x-tar", use = "reveal" },
  { mime = "application/x-bzip", use = "reveal" },
  { mime = "application/x-7z-compressed", use = "reveal" },
  { mime = "application/x-rar", use = "reveal" },
  # Default - reveal
  { url = "*", use = "reveal" },
]

[tasks]
# Concurrent worker limits
file_workers = 10
plugin_workers = 15
fetch_workers = 5
preload_workers = 5
process_workers = 5
bizarre_retry = 5
# Image decoding
image_alloc = 536870912  # 512MB
image_bound = [0, 0]  # Unlimited
