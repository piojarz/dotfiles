# Tokyo Night theme for Yazi
# A dark, modern theme matching your existing setup

[mgr]
# Directory styling
cwd = { fg = "#7aa2f7" }

# Tab styling
hovered = { bg = "#283457", bold = true }
preview_hovered = { bg = "#283457", bold = true }

# File styling - by extension
icon_dirs = { fg = "#7aa2f7" }
icon_files = { fg = "#c0caf5" }
icon_exec = { fg = "#9ece6a" }
icon_link = { fg = "#7dcfff" }
icon_hidden = { fg = "#565f89" }
icon_dead = { fg = "#f7768e" }
icon_unset = { fg = "#c0caf5" }

# Selection
selected = { bg = "#283457" }

# File type colors
[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#7dcfff" },
  # Videos
  { mime = "video/*", fg = "#bb9af7" },
  # Audio
  { mime = "audio/*", fg = "#e0af68" },
  # Archives
  { mime = "application/zip", fg = "#ff9e64" },
  { mime = "application/gzip", fg = "#ff9e64" },
  { mime = "application/x-tar", fg = "#ff9e64" },
  { mime = "application/x-bzip", fg = "#ff9e64" },
  # Documents
  { mime = "application/pdf", fg = "#f7768e" },
  { mime = "application/doc", fg = "#7aa2f7" },
  { mime = "application/docx", fg = "#7aa2f7" },
  # Code
  { url = "*.js", fg = "#e0af68" },
  { url = "*.ts", fg = "#7aa2f7" },
  { url = "*.jsx", fg = "#e0af68" },
  { url = "*.tsx", fg = "#7aa2f7" },
  { url = "*.vue", fg = "#9ece6a" },
  { url = "*.py", fg = "#7dcfff" },
  { url = "*.rb", fg = "#f7768e" },
  { url = "*.go", fg = "#7dcfff" },
  { url = "*.rs", fg = "#ff9e64" },
  { url = "*.lua", fg = "#7aa2f7" },
  { url = "*.sh", fg = "#9ece6a" },
  { url = "*.zsh", fg = "#9ece6a" },
  { url = "*.bash", fg = "#9ece6a" },
  { url = "*.json", fg = "#e0af68" },
  { url = "*.yaml", fg = "#e0af68" },
  { url = "*.yml", fg = "#e0af68" },
  { url = "*.toml", fg = "#e0af68" },
  { url = "*.md", fg = "#c0caf5" },
  { url = "*.mdx", fg = "#c0caf5" },
  { url = "*.html", fg = "#f7768e" },
  { url = "*.css", fg = "#7dcfff" },
  { url = "*.scss", fg = "#7dcfff" },
  { url = "*.sass", fg = "#7dcfff" },
  { url = "*.less", fg = "#7dcfff" },
  # Git
  { url = ".gitignore", fg = "#f7768e" },
  { url = ".gitattributes", fg = "#f7768e" },
  { url = ".gitmodules", fg = "#f7768e" },
  # Config
  { url = "*.conf", fg = "#bb9af7" },
  { url = "*.cfg", fg = "#bb9af7" },
  { url = "*.ini", fg = "#bb9af7" },
  # Special files
  { url = "Dockerfile", fg = "#7dcfff" },
  { url = "docker-compose.yml", fg = "#7dcfff" },
  { url = "Makefile", fg = "#e0af68" },
  { url = "LICENSE", fg = "#c0caf5" },
  { url = "README*", fg = "#c0caf5" },
  { url = "CHANGELOG*", fg = "#c0caf5" },
  { url = "CONTRIBUTING*", fg = "#c0caf5" },
  # Default
  { url = "*", fg = "#c0caf5" },
]

[status]
separator_style = { bg = "#1a1b26", fg = "#414868" }
progress_label = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#1a1b26" }
progress_error = { fg = "#f7768e", bg = "#1a1b26" }

# Permissions
permissions_t = { fg = "#7aa2f7" }
permissions_r = { fg = "#9ece6a" }
permissions_w = { fg = "#e0af68" }
permissions_x = { fg = "#f7768e" }
permissions_s = { fg = "#bb9af7" }

[select]
border = { fg = "#7aa2f7" }
active = { fg = "#c0caf5", bg = "#283457" }
inactive = { fg = "#c0caf5" }

[input]
border = { fg = "#7aa2f7" }
title = { fg = "#c0caf5" }
value = { fg = "#c0caf5" }
selected = { bg = "#283457" }

[completion]
border = { fg = "#7aa2f7" }
active = { fg = "#c0caf5", bg = "#283457" }
inactive = { fg = "#c0caf5" }
icon_file = "󰈙"
icon_folder = "󰉋"
icon_command = "󰆍"

[tasks]
border = { fg = "#7aa2f7" }
title = { fg = "#c0caf5" }
hovered = { fg = "#c0caf5", bg = "#283457" }

[which]
mask = { bg = "#1a1b26" }
cand = { fg = "#7dcfff" }
desc = { fg = "#565f89" }
border = { fg = "#7aa2f7" }
title = { fg = "#c0caf5" }
footer = { fg = "#c0caf5", bg = "#283457" }

[help]
on = { fg = "#9ece6a" }
run = { fg = "#e0af68" }
hovered = { bg = "#283457", bold = true }
footer = { fg = "#c0caf5", bg = "#283457" }

[notify]
title_info = { fg = "#7aa2f7" }
title_warning = { fg = "#e0af68" }
title_error = { fg = "#f7768e" }

[spot]
border = { fg = "#7aa2f7" }
title = { fg = "#c0caf5" }

[tag]
title = { fg = "#c0caf5" }
