# Hyprlock Configuration
# Tokyo Night themed lock screen
# Documentation: https://github.com/hyprwm/hyprlock

# Background
background {
    monitor =
    path = ~/wallpapers/default.jpg
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.5
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time display
time {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(c0caf5ff)
    font_size = 90
    font_family = JetBrains Mono Bold
    position = 0, 200
    halign = center
    valign = center
}

# Date display
date {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(7aa2f7ff)
    font_size = 25
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(1a1b26ff)
    font_color = rgba(c0caf5ff)
    fade_on_empty = true
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

# Username label
label {
    monitor =
    text = Hi, $USER
    color = rgba(bb9af7ff)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, -130
    halign = center
    valign = center
}

# Lock icon
label {
    monitor =
    text = 🔒
    color = rgba(c0caf5ff)
    font_size = 40
    position = 0, -180
    halign = center
    valign = center
}

# General settings
general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    disable_loading_bar = true
}

# PAM authentication
auth {
    pam {
        enabled = true
    }
}
