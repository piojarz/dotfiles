# Hyprpaper Configuration
# Static wallpaper for Hyprland
# Place your wallpaper at ~/wallpapers/default.jpg
# or update the paths below

# Preload wallpapers (supports multiple for different monitors)
preload = ~/wallpapers/default.jpg
# preload = ~/wallpapers/wallpaper2.jpg

# Set wallpaper for all monitors (use monitor name for specific assignment)
# Get monitor names with: hyprctl monitors
wallpaper = ,~/wallpapers/default.jpg

# Alternative: specific wallpapers per monitor
# wallpaper = DP-1,~/wallpapers/default.jpg
# wallpaper = HDMI-A-1,~/wallpapers/secondary.jpg

# Splash text (disabled in hyprland.conf via misc settings)
# splash = false

# Note: If ~/wallpapers/default.jpg doesn't exist,
# hyprpaper will fail silently. Create the directory:
# mkdir -p ~/wallpapers
# And place a .jpg or .png there
