# Hyprland Configuration
# Auto-detected displays, Tokyo Night theme, kanata-compatible
# Documentation: https://wiki.hyprland.org/

# ==================== MONITORS ====================
# Auto-detect all monitors with preferred settings
monitor=,preferred,auto,auto

# ==================== INPUT ====================
# Keyboard settings - compatible with kanata
input {
    kb_layout = us
    # No kb_options set here - kanata handles key remapping
    # Caps -> Esc/Ctrl and Right Alt -> Hyper
    
    repeat_delay = 250
    repeat_rate = 35
    
    follow_mouse = 1
    float_switch_override_focus = 0
}



# ==================== GENERAL ====================
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)
    
    layout = dwindle
    resize_on_border = true
}

# ==================== DECORATION ====================
decoration {
    rounding = 8
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1b26ee)
    }
}

# ==================== ANIMATIONS ====================
animations {
    enabled = yes
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    
    animation = windows, 1, 7, easeOutQuint
    animation = windowsOut, 1, 7, easeOutQuint, popin 80%
    animation = border, 1, 10, easeOutQuint
    animation = fade, 1, 7, easeOutQuint
    animation = workspaces, 1, 6, easeOutQuint, slide
    animation = specialWorkspace, 1, 6, easeOutQuint, slidevert
}

# ==================== LAYOUT ====================
dwindle {
    pseudotile = yes
    preserve_split = yes
    special_scale_factor = 0.8
}

master {
    new_status = master
    new_on_top = true
    mfact = 0.55
}

# ==================== MISC ====================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    background_color = 0x1a1b26
}

# ==================== XWAYLAND ====================
xwayland {
    force_zero_scaling = true
}

# ==================== ENVIRONMENT ====================
# Wayland environment variables
# Note: When using UWSM, these are handled via /etc/uwsm/env or ~/.config/uwsm/env
# env = MOZ_ENABLE_WAYLAND,1
# env = QT_QPA_PLATFORM,wayland
# env = SDL_VIDEODRIVER,wayland
# env = _JAVA_AWT_WM_NONREPARENTING,1
# env = XDG_CURRENT_DESKTOP,Hyprland
# env = XDG_SESSION_TYPE,wayland
# env = XDG_SESSION_DESKTOP,Hyprland

# ==================== AUTO-START ====================
# These start automatically when Hyprland launches

# Wallpaper (hyprpaper)
exec-once = uwsm app -- hyprpaper

# Authentication agent
exec-once = uwsm app -- /usr/lib/polkit-kde-authentication-agent-1

# Idle management and lock
exec-once = uwsm app -- hypridle

# Status bar (hyprpanel)
exec-once = uwsm app -- hyprpanel

# Clipboard manager
exec-once = uwsm app -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -- wl-paste --type image --watch cliphist store

# Notification daemon
exec-once = uwsm app -- mako

# Storage automount
exec-once = uwsm app -- udiskie

# Network applet
exec-once = uwsm app -- nm-applet --indicator

# Kanata is already running as systemd user service

# ==================== WINDOW RULES ====================
# Common app workspace assignments
window = class:^(firefox|Firefox)$, workspace:2
window = class:^(Google-chrome|google-chrome)$, workspace:2
window = class:^(Slack|slack)$, workspace:3
window = class:^(discord|Discord)$, workspace:3
window = class:^(Thunderbird|thunderbird)$, workspace:4
window = class:^(Spotify|spotify)$, workspace:5

# Floating windows
window = class:^(pavucontrol)$, float
window = class:^(blueman-manager)$, float
window = class:^(nm-connection-editor)$, float
window = class:^(wlogout)$, float
window = class:^(rofi)$, float
window = title:^(Picture-in-Picture)$, float

# Size for floating windows
window = class:^(pavucontrol)$, size:800 600
window = class:^(blueman-manager)$, size:800 600

# Idle inhibit for video players
window = class:^(mpv|vlc|firefox|chrome)$, idleinhibit:focus
window = class:^(.*)$, idleinhibit:fullscreen

# ==================== KEY BINDINGS ====================
# Note: These work with kanata remapping
# Caps->Esc/Ctrl, Right Alt->Hyper

# Terminal
bind = SUPER, Return, exec, kitty

# Launcher (rofi)
bind = SUPER, Space, exec, rofi -show drun
bind = SUPER, Tab, exec, rofi -show window

# File Manager (thunar)
bind = SUPER, E, exec, thunar

# Kill window
bind = SUPER, Q, killactive

# Fullscreen
bind = SUPER, F, fullscreen

# Toggle floating
bind = SUPER, T, togglefloating

# Pseudo-tile
bind = SUPER, P, pseudo

# Change layout
bind = SUPER, S, togglesplit

# Focus movement (vim keys)
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

# Window movement
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r

# Resize mode
bind = SUPER, R, submap, resize
submap = resize
binde = , H, resizeactive, -10 0
binde = , J, resizeactive, 0 10
binde = , K, resizeactive, 0 -10
binde = , L, resizeactive, 10 0
bind = , Escape, submap, reset
submap = reset

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = SUPER, minus, togglespecialworkspace, magic
bind = SUPER SHIFT, minus, movetoworkspace, special:magic

# Scroll through workspaces
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Mouse bindings
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Screenshot (grim + slurp)
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER, Print, exec, grim - | wl-copy

# Color picker (hyprpicker)
bind = SUPER SHIFT, P, exec, hyprpicker -a

# Lock screen
bind = SUPER, Escape, exec, hyprlock

# Logout menu
bind = SUPER SHIFT, E, exec, wlogout

# Volume control
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Brightness control
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media keys
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# ==================== PLUGINS ====================
# Uncomment if you install plugins
# plugin = /usr/lib/libhyprlualoader.so
